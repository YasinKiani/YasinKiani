# Builds the live parts of the profile README and pushes them to the `output` branch:
#   - profile-details.svg  (activity card, with a clean "Yasin Kiani" title)
#   - followers.svg / views.svg  (stats badges in the same style as the other badges)
#   - github-snake(-dark).svg  (contribution graph eaten by a snake, orange theme)
name: Generate profile assets

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Profile card with a clean title
        # the card service titles it "login (name…)"; show just the name instead
        run: |
          mkdir -p dist
          curl -sSfL "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=${{ github.repository_owner }}&theme=gruvbox" -o dist/profile-details.svg
          sed -i -E 's#>YasinKiani \([^<]*<#>Yasin Kiani<#' dist/profile-details.svg

      - name: Followers and profile-views badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python3 scripts/stats_badges.py dist

      - name: Contribution snake (orange theme)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#F59541&color_dots=#ebedf0,#fde3c8,#fbc08a,#f89c4f,#e07b24
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#F59541&color_dots=#161b22,#4d2c0f,#8a4a12,#c96d1c,#F59541

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
